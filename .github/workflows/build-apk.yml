name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y compilar web
        run: |
          npm install
          npm run build

      - name: Sincronizar Capacitor con Android
        run: |
          npx cap sync android

      - name: Dar permisos de ejecucion a Gradle
        run: |
          chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir archivo APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AuraSalon-Peluqueria-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
